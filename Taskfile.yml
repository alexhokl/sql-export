version: '3'

tasks:
  build:
    desc: Build all packages
    cmds:
      - go build ./...

  install:
    desc: Install the binary
    cmds:
      - go install

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  coverage:
    desc: Run tests with coverage
    cmds:
      - go test --cover ./...

  coverage-html:
    desc: Generate HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html